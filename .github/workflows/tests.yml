name: synthetic-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic:
    name: Synthetic subset (not historical/full baseline), Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run literal domain/gate commands and synthetic regressions in isolated HOME
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/test_synthetic.py
